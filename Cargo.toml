[workspace]
members = ["crates/tavosh-proto", "crates/tavosh-parser", "crates/tavosh-daemon"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
tavosh-proto = { path = "crates/tavosh-proto", version = "=0.1.0" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
